<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Password Strength Checker</h1>

        <p>Check how strong your password is</p>

        <label>Enter Password</label>

        <div class="password-box">
            <input type="password" id="password" placeholder="Enter your password">
            <button type="button" onclick="togglePassword()">👁️</button>
        </div>

        <button onclick="checkPassword()">Check Strength</button>

        <button type="button" class="reset-btn" onclick="resetPassword()"> Reset </button>

        <div class="requirements">
            <h3>Requirements:</h3>

            <ul type="disc">
                <li id="length">✗ At least 8 characters</li>
                <li id="uppercase">✗ Uppercase letter</li>
                <li id="lowercase">✗ Lowercase letter</li>
                <li id="number">✗ Number</li>
                <li id="special">✗ Special character</li>
            </ul>

        </div>

        <h3 id="result"></h3>

        <div id="suggestions"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
